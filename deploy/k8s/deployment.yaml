apiVersion: apps/v1
kind: Deployment
metadata:
  name: kestrel-gateway
  namespace: kestrel
spec:
  replicas: 3
  selector:
    matchLabels:
      app: kestrel-gateway
  template:
    metadata:
      labels:
        app: kestrel-gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/roykaushik07/kestrel-gateway:1.8.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: kestrel-gateway-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              memory: 256Mi
