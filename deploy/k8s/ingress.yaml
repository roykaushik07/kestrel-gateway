apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kestrel-gateway
  namespace: kestrel
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
    - host: edge.kestrel-air.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kestrel-gateway
                port:
                  number: 8080
